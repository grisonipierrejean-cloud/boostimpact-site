<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Résultat du prospect</title>
<link rel="preload" href="fonts/newsreader.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/hanken-grotesk.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Page du lien « résultat » de l'email « Tournée du jour » (resultat.html?r=<résultat>#<jeton>), pour PJ seul : sans connexion, le jeton suffit
   (64 caractères, 7 jours, usage unique : bloc « Prospection quotidienne » de schema.sql). Rien n'est enregistré à l'ouverture (un antivirus de
   messagerie peut ouvrir les liens) : le résultat proposé par le lien est présélectionné, PJ confirme d'un clic. Styles repris de desinscription.html. */
:root{color-scheme:light;--fond:#F2F3F1;--surface:#FFFFFF;--releve:#E8EAE7;--creux:#F2F3F1;--encre:#121614;--texte2:#2E3431;--discret:#4E5652;--bord:#7A817D;--filet:rgba(18,22,20,.12);--marque:#7CCE12;--accent:#7CCE12;--accent-fonce:#6CB80E;--attention:#7A5C00;--danger:#A61B1B;
  --police-titre:'Newsreader',Georgia,'Times New Roman',serif;--police-texte:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;--largeur-titre:100%;--graisse-titre:400;--graisse-texte:400;--graisse-moyenne:500;--graisse-forte:600;--titre:var(--police-titre);--sans:var(--police-texte)}
@font-face{font-family:'Newsreader';font-weight:200 800;font-style:normal;font-display:swap;src:url(fonts/newsreader.woff2) format('woff2')}@font-face{font-family:'Hanken Grotesk';font-weight:400 600;font-style:normal;font-display:swap;src:url(fonts/hanken-grotesk.woff2) format('woff2')}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--sans);font-size:17px;line-height:1.5;color:var(--encre);background:var(--fond)}
h1,h2,p{margin:0}
main{max-width:560px;margin:0 auto;padding:24px 16px calc(32px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
#page,#erreur,#fait{display:flex;flex-direction:column;gap:14px}
.logo{font-family:var(--sans);font-weight:var(--graisse-forte);font-size:20px;letter-spacing:-.03em;white-space:nowrap}/* logo du site, sur une ligne, couleur du texte (30/10/2026) */.logo-img{display:block;height:22px;width:auto;max-width:none}
.barre{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:-8px -8px -8px 0}
.langues{display:inline-flex;align-items:center;gap:2px}
.langues button{font:inherit;font-size:14px;font-weight:var(--graisse-forte);letter-spacing:.04em;min-width:44px;min-height:44px;padding:0 8px;background:none;border:0;border-radius:6px;color:var(--discret);cursor:pointer;text-decoration:none}
.langues button[aria-pressed=true]{color:var(--encre);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px}
.langues button:hover{color:var(--encre)}
.tete{display:flex;flex-direction:column;gap:10px;padding:0 2px 4px}
.commerce{font-size:17px;font-weight:var(--graisse-forte);color:var(--texte2);overflow-wrap:anywhere}
h1{font-family:var(--titre);font-weight:var(--graisse-titre);font-size:34px;line-height:1.08;letter-spacing:-.018em;text-wrap:balance;font-stretch:var(--largeur-titre);font-variant-numeric:lining-nums}
.carte{background:var(--surface);color:var(--encre);border:1px solid var(--filet);border-radius:8px;padding:18px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
h2{font-family:var(--sans);font-size:20px;font-weight:var(--graisse-forte);line-height:1.25}
.note{font-size:15px;color:var(--discret)}
.visuel{display:block;width:100%;max-width:340px;aspect-ratio:4/5;object-fit:cover;border-radius:8px;background:var(--releve)}
.visuel.vertical{aspect-ratio:9/16;max-width:280px}
video.visuel,img.visuel.vertical{object-fit:contain;background:#000}
.legendes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.legendes li{padding:12px 0;border-bottom:1px solid var(--filet);display:flex;flex-direction:column;gap:4px}
.legendes li:last-child{border-bottom:0}
.reseau{font-size:13px;font-weight:var(--graisse-forte);color:var(--discret)}
.texte{white-space:pre-line;overflow-wrap:anywhere;color:var(--texte2)}
.citation{color:var(--texte2);overflow-wrap:anywhere}
.bouton{display:flex;align-items:center;justify-content:center;width:100%;font:inherit;font-size:18px;font-weight:var(--graisse-forte);line-height:1.25;text-align:center;text-decoration:none;background:var(--marque);color:#121614;border:1px solid var(--marque);border-radius:6px;padding:13px 18px;min-height:56px;cursor:pointer}
.bouton:hover{background:#6CB80E;border-color:#6CB80E;color:#121614}
.bouton.second{background:transparent;color:var(--encre);border-color:rgba(18,22,20,.55)}
.bouton.second:hover{background:var(--encre);border-color:var(--encre);color:#FFFFFF}
.lien{font:inherit;font-size:16px;font-weight:var(--graisse-forte);background:none;border:0;padding:8px 4px;min-height:44px;color:var(--texte2);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.bouton:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid #121614;outline-offset:2px}
a{color:var(--encre);text-underline-offset:3px}
.carte p>a{display:inline-flex;align-items:center;min-height:44px;font-weight:var(--graisse-forte)}
.actions{display:flex;flex-direction:column;gap:10px}
.f{display:flex;flex-direction:column;gap:6px}
label{font-size:15px;font-weight:var(--graisse-forte);color:var(--texte2)}
textarea{font:inherit;font-size:16px;line-height:1.45;color:var(--encre);background:var(--creux);border:1px solid var(--bord);border-radius:6px;padding:11px 14px;min-height:132px;width:100%;resize:vertical}
textarea:focus-visible{border-color:#121614}
#reponse{min-height:220px}
.msg{font-size:16px;font-weight:var(--graisse-forte);color:var(--texte2)}
.msg:empty{display:none}
.fort{font-weight:var(--graisse-forte)}
.pied{font-size:14px;line-height:1.5;padding:6px 2px 0;color:var(--discret)}
.pied-legal{font-size:12px;line-height:1.5;padding:18px 2px 0;color:var(--discret);display:flex;flex-direction:column;gap:2px}
.pied-legal .liens-legaux{display:flex;flex-wrap:wrap;gap:0 16px}
.pied-legal a{color:inherit;display:inline-flex;align-items:center;min-height:44px;text-underline-offset:3px}
@media (min-width:600px){main{padding-top:48px}h1{font-size:42px}.carte{padding:24px}.actions{flex-direction:row;flex-wrap:wrap;align-items:center}.actions .bouton{width:auto}}
.choix{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.choix .bouton{font-size:16px;min-height:52px;padding:10px 12px}
.choix .bouton[aria-pressed=false]{background:transparent;color:var(--encre);border-color:rgba(18,22,20,.55)}
.choix .bouton[aria-pressed=false]:hover{background:var(--releve)}
</style>
</head>
<body>
<main>
  <div class="barre"><p class="logo" translate="no"><img class="logo-img" src="icones/logo-ligne-encre.png" width="482" height="80" alt="boost impact."></p></div>
  <p id="chargement" class="note" role="status">Chargement.</p>

  <div id="erreur" hidden>
    <section class="carte"><h2>Lien inutilisable</h2><p id="erreur-texte">Ce lien n'est pas reconnu.</p><p><a href="console.html#/prospects">Ouvrir la console, onglet Prospects</a></p></section>
  </div>

  <div id="page" hidden>
    <div class="tete"><p class="commerce" id="commerce"></p><h1>Résultat du prospect</h1></div>
    <section class="carte">
      <p class="note" id="contexte"></p>
      <div class="choix" role="group" aria-label="Résultat">
        <button type="button" class="bouton" data-r="rdv" aria-pressed="false">Rendez-vous</button>
        <button type="button" class="bouton" data-r="rappeler" aria-pressed="false">Rappeler</button>
        <button type="button" class="bouton" data-r="pilote" aria-pressed="false">Pilote signé</button>
        <button type="button" class="bouton" data-r="pas_interesse" aria-pressed="false">Pas intéressé</button>
      </div>
      <p class="note" id="effet"></p>
      <div class="f"><label for="note">Note pour vous (facultatif, 500 caractères au plus)</label><textarea id="note" maxlength="500" placeholder="Ex. : rappeler jeudi après 15 h, voit avec son associé"></textarea></div>
      <div class="actions"><button type="button" class="bouton" id="enregistrer" disabled>Enregistrer</button></div>
      <p class="msg" id="msg" role="status"></p>
    </section>
  </div>

  <div id="fait" hidden>
    <section class="carte"><h2>C'est noté</h2><p id="fait-texte"></p><p><a href="console.html#/prospects">Voir les prospects dans la console</a></p></section>
  </div>
  <p class="pied" id="demo" hidden>Démonstration : rien n'est envoyé, les données restent dans ce navigateur.</p>
  <noscript><section class="carte"><p>Cette page a besoin de JavaScript. Notez le résultat dans la console, onglet Prospects.</p></section></noscript>
</main>
<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="donnees.js"></script>
<script src="resultat.js"></script>
</body>
</html>
