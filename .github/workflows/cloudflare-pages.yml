# Publication du site et de l'espace client sur Cloudflare Pages (24/10/2026).
# GitHub Pages n'autorise ni une activité commerciale (abonnements) ni la saisie de mots de passe :
# https://docs.github.com/en/pages/getting-started-with-github-pages/github-pages-limits
# Secret à poser par PJ (Settings > Secrets and variables > Actions) : CLOUDFLARE_API_TOKEN
# (jeton Cloudflare limité à « Account > Cloudflare Pages > Edit »). L'identifiant du compte n'est pas un secret.
name: Publication Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: cloudflare-pages
  cancel-in-progress: false
jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: dece6d5644e21a5d0436168deb19ded9
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PROJET: boostimpact
    steps:
      - uses: actions/checkout@v4
      - name: Dossier publié (sans les fichiers propres à GitHub)
        run: |
          mkdir -p ../publie
          rsync -a --exclude '.git' --exclude '.github' --exclude 'CNAME' --exclude '.nojekyll' ./ ../publie/
          ls ../publie | head -50
      - name: Projet Cloudflare Pages (créé s'il n'existe pas)
        run: npx --yes wrangler@3.114.1 pages project create "$PROJET" --production-branch=main || echo "projet déjà présent"
      - name: Publication
        run: npx --yes wrangler@3.114.1 pages deploy ../publie --project-name="$PROJET" --branch=main --commit-dirty=true
