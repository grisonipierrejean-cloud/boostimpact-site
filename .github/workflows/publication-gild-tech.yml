# Publication de gild-tech.com (projet Cloudflare Pages « gild-tech », même compte Cloudflare) (12/11/2026).
# Pourquoi ici : le jeton CLOUDFLARE_API_TOKEN (« Account > Cloudflare Pages > Edit ») n'est posé que dans ce dépôt.
# Source publiée : grisonipierrejean-cloud/gild-tech-website (dépôt public), branche main.
# Exclus : .git, .github, .gitignore, et tout fichier de plus de 25 Mio (limite par fichier de Cloudflare Pages ;
# au 25/10, seul assets/villa-samui-01/reel-01-aerial.mp4 était concerné, il n'a jamais été en ligne).
# Lancement : bouton « Run workflow » (onglet Actions), ou tout commit qui modifie ce fichier.
name: Publication gild-tech.com
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publication-gild-tech.yml']
concurrency:
  group: cloudflare-pages-gild-tech
  cancel-in-progress: false
jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: dece6d5644e21a5d0436168deb19ded9
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PROJET: gild-tech
    steps:
      - uses: actions/checkout@v4
        with:
          repository: grisonipierrejean-cloud/gild-tech-website
          ref: main
          path: source
      - name: Dossier publié
        run: |
          cd source && echo "Commit publié : $(git log --oneline -1)" && cd ..
          mkdir -p publie
          rsync -a --exclude '.git' --exclude '.github' --exclude '.gitignore' source/ publie/
          echo "Fichiers écartés (plus de 25 Mio) :"
          find publie -type f -size +25M -print -delete
          echo "Nombre de fichiers publiés : $(find publie -type f | wc -l)"
      - name: Publication
        run: npx --yes wrangler@3.114.1 pages deploy publie --project-name="$PROJET" --branch=main --commit-dirty=true
